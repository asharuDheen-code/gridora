<script>
/* The browser URL still points at the missing path, so work out the site root
   and rewrite every link against it. On *.github.io the first path segment is
   the repository name; elsewhere the site is assumed to sit at the domain root. */
(function () {
  var segments = location.pathname.split('/').filter(Boolean);
  var root = '/';
  if (/\.github\.io$/i.test(location.hostname) && segments.length) {
    root = '/' + segments[0] + '/';
  }
  document.querySelectorAll('[data-home]').forEach(function (el) { el.setAttribute('href', root); });
  document.querySelectorAll('[data-rel]').forEach(function (el) {
    el.setAttribute('href', root + el.getAttribute('data-rel'));
  });
})();
