<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'NotoML';src:url('fonts/NotoSansMalayalam.woff2') format('woff2');font-weight:100 900;}
:root{--cream:#FBF3EA;--orange:#F26B3A;--teal:#19B39B;--ink:#2A211B;--muted:#7A6A5D;--line:#EADCCB;--soft:#FFF8F1;--red:#E0453A;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--cream)}
body{font-family:'Inter','NotoML',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%}
.scene{position:absolute;inset:0;opacity:0}
.card{position:absolute;background:#fff;border-radius:28px;box-shadow:0 12px 34px rgba(80,50,20,.08),0 1px 0 rgba(80,50,20,.04)}
.h1{position:absolute;left:110px;top:150px;font-size:66px;font-weight:800;letter-spacing:-1.5px}
.h1 .acc{color:var(--orange)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;font-weight:700;font-size:24px;letter-spacing:.5px}
.chip.o{background:#FDE3D8;color:#C2471B}.chip.t{background:#D3F2EC;color:#0E7E6C}.chip.g{background:#EFE6DC;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:'Inter';font-feature-settings:"tnum";}
.badge{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
#hdr{position:absolute;left:80px;top:44px;height:56px;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;color:var(--ink)}
#hdr .dot{width:16px;height:16px;border-radius:50%;background:var(--orange)}
#brand{position:absolute;right:80px;top:52px;font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
#brand span{color:var(--orange)}
#prog{position:absolute;left:0;top:0;height:8px;background:linear-gradient(90deg,var(--orange),var(--teal))}
#cap{position:absolute;left:50%;top:948px;transform:translateX(-50%);max-width:1380px;padding:16px 38px 20px;border-radius:24px;background:rgba(42,33,27,.92);color:#fff;font-family:'NotoML','Inter';font-size:40px;font-weight:600;line-height:1.35;white-space:nowrap;opacity:0}
#cap .w{display:inline-block;padding:0 6px;border-radius:10px;margin:0 1px}
#cap .w.on{background:var(--orange);color:#fff}
#cap .w.past{color:#fff}#cap .w.fut{color:rgba(255,255,255,.62)}
/* window mock */
.win{position:absolute;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(80,50,20,.14);overflow:hidden;border:1px solid var(--line)}
.win .bar{height:56px;background:#F6EEE5;display:flex;align-items:center;padding:0 22px;gap:10px;border-bottom:1px solid var(--line)}
.win .bar i{width:14px;height:14px;border-radius:50%;background:#E3D4C3;display:block}
.win .bar .tt{margin-left:16px;font-size:20px;font-weight:600;color:var(--muted)}
.win .bar .ill{margin-left:auto;font-size:17px;font-weight:700;letter-spacing:1px;color:#fff;background:#B8A796;padding:5px 12px;border-radius:8px;text-transform:uppercase}
.win .body{position:absolute;left:0;top:56px;right:0;bottom:0}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:14px;font-weight:700;font-size:22px}
.btn.p{background:var(--ink);color:#fff}.btn.o{background:var(--orange);color:#fff}.btn.t{background:var(--teal);color:#fff}.btn.l{background:#fff;border:2px solid var(--line);color:var(--ink)}
.field{position:absolute;height:60px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:24px;display:flex;align-items:center;padding:0 18px;color:var(--ink);white-space:nowrap;overflow:hidden}
.field.focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(25,179,155,.15)}
.lbl{position:absolute;font-size:20px;font-weight:700;color:var(--muted)}
.caret{display:inline-block;width:3px;height:30px;background:var(--orange);margin-left:2px;vertical-align:middle}
.bullet{position:absolute;left:110px;display:flex;align-items:center;gap:20px;font-size:32px;font-weight:600;width:660px}
.bullet .ck{flex:none;width:44px;height:44px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center}
.pill{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800}
.ph{position:absolute;border-radius:10px;background:#F1E8DE}
</style></head>

<script>
const D=window.DATA; const TL=D.timeline; const SC=D.script.scenes;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function el(tag,cls,parent,html,style){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);if(parent)parent.appendChild(e);return e}
const UNITLESS=new Set(['fontWeight','zIndex','opacity','lineHeight','flex']);function px(o){const r={};for(const k in o)r[k]=(typeof o[k]==='number'&&!UNITLESS.has(k))?o[k]+'px':o[k];return r}
function pop(e,s,dur=.45){if(s<=0){e.style.opacity=0;e.style.transform='scale(.7)';return}e.style.opacity=clamp(s/.18);e.style.transform=`scale(${.7+.3*back(s/dur)})`}
function slide(e,s,dy=36,dx=0,dur=.5){const p=easeOut(s/dur);e.style.opacity=s<=0?0:p;e.style.transform=`translate(${dx*(1-p)}px,${dy*(1-p)}px)`}
function fade(e,s,dur=.35){e.style.opacity=s<=0?0:clamp(s/dur)}
function typed(text,s,dur){const p=clamp(s/dur);return text.slice(0,Math.round(text.length*p))}
const CHECK='<svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const WARN=c=>`<svg width="64" height="64" viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="${c}"/><rect x="11" y="9" width="2" height="6.5" rx="1" fill="#fff"/><circle cx="12" cy="18" r="1.3" fill="#fff"/></svg>`;
const PHONE='<svg width="44" height="44" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z" fill="#fff"/></svg>';
const GLOBE='<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>';

/* ---------- background ---------- */
const bg=document.getElementById('bg');
const blobs=[[1650,-120,620,'rgba(242,107,58,.10)'],[-180,700,560,'rgba(25,179,155,.10)'],[900,980,420,'rgba(242,107,58,.05)']].map(([x,y,r,c])=>el('div','blob',bg,null,px({left:x,top:y,width:r,height:r,background:`radial-gradient(circle, ${c} 0%, rgba(0,0,0,0) 70%)`})));
function bgUpdate(t){blobs.forEach((b,i)=>{b.style.transform=`translate(${Math.sin(t*.13+i*2)*40}px,${Math.cos(t*.11+i)*30}px)`})}

/* ---------- cursor ---------- */
function cursor(parent,keys){
  const c=el('div','abs',parent,'<svg width="44" height="54" viewBox="0 0 22 27"><path d="M2 2l17 11.5-7.6 1.4 4.4 8.6-3.3 1.6-4.4-8.6L2 22z" fill="#2A211B" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>',{zIndex:50,left:0,top:0});
  const rip=el('div','abs',parent,null,{zIndex:49,width:'70px',height:'70px',borderRadius:'50%',border:'5px solid var(--orange)',opacity:0});
  return function(lt){
    if(!keys.length||lt<keys[0].t-0.3){c.style.opacity=0;rip.style.opacity=0;return}
    c.style.opacity=clamp((lt-keys[0].t+.3)/.3);
    let x=keys[0].x,y=keys[0].y;
    for(let i=1;i<keys.length;i++){const a=keys[i-1],b=keys[i];
      if(lt>=b.t){x=b.x;y=b.y;continue}
      if(lt>a.t){const mv=b.mv||.6;const p=ease((lt-(b.t-mv))/mv);if(lt>b.t-mv){x=a.x+(b.x-a.x)*p;y=a.y+(b.y-a.y)*p}else{x=a.x;y=a.y}}break}
    c.style.transform=`translate(${x-4}px,${y-3}px)`;
    let ro=0,rs=1;for(const k of keys)if(k.click&&lt>=k.t&&lt<k.t+.5){const p=(lt-k.t)/.5;ro=1-p;rs=.4+p*1.1;rip.style.left=(k.x-35)+'px';rip.style.top=(k.y-35)+'px'}
    rip.style.opacity=ro;rip.style.transform=`scale(${rs})`;
  }
}

/* ---------- scene builders ---------- */

  const vs=el('div','badge',S,'VS',px({left:910,top:360,width:100,height:100,background:'var(--ink)',fontSize:32}));
  const R=el('div','card',S,null,px({left:1070,top:200,width:700,height:420,border:'4px solid var(--teal)'}));
  el('div','chip t abs',R,'YOU + AI',px({left:48,top:48}));
  el('div','abs',R,'₹0<span style="font-size:70px;color:var(--orange)">*</span>',px({left:48,top:110,fontSize:170,fontWeight:800,color:'var(--teal)',letterSpacing:-4}));
  el('div','abs muted',R,'Claude + Higgsfield connector',px({left:48,top:310,fontSize:34,fontWeight:600}));
  const row=el('div','abs',S,null,{left:'0',right:'0',top:'690px',display:'flex',justifyContent:'center',gap:'22px',alignItems:'center'});
  const lab=el('div','',row,'In this video:',px({fontSize:32,fontWeight:700,marginRight:10}));
  const ch=[['o','Full setup'],['o','The catch'],['t','5 ready prompts']].map(([k,t])=>el('div','chip '+k,row,t,px({fontSize:30,padding:'14px 30px'})));
  const fn=el('div','abs muted',S,'*During Higgsfield\'s 3-day free trial. A paid Claude plan is needed.',{left:'0',right:'0',top:'815px',textAlign:'center',fontSize:'26px',fontWeight:500});
  return lt=>{slide(L,lt-c(0),40,-40);fade(vs,lt-c(0,.6));slide(R,lt-c(1),40,40);st.style.width=(easeOut((lt-c(1,.2))/.5)*600)+'px';
    pr.style.color=lt>c(1,.2)?'#B9AA9C':'var(--ink)';fade(lab,lt-c(2));pop(ch[0],lt-c(2,.25));pop(ch[1],lt-c(2,.6));pop(ch[2],lt-c(3,.2));fade(fn,lt-c(1,.6))}
};
B.new=(S,c)=>{

  const mk=(x,tagc,tag,title,sub)=>{const k=el('div','card',S,null,px({left:x,top:265,width:820,height:300}));el('div','chip abs '+tagc,k,tag,px({left:44,top:40}));el('div','abs',k,title,px({left:44,top:112,fontSize:54,fontWeight:800,letterSpacing:-1}));const s=el('div','abs muted',k,sub,px({left:44,top:196,fontSize:30,fontWeight:600,width:740,lineHeight:1.35,borderRadius:8,padding:'2px 6px',marginLeft:-6}));return [k,s]};
  const [A]=mk(110,'o','LAUNCHED · 9 NOV 2026','Claude Fable 5.2','Needs a paid Claude plan');
  const [Bc,bs]=mk(990,'t','NEW USERS · 72 HOURS','Higgsfield 3-day free trial','“Unlimited” access to top video, image &amp; audio models');

  const nodes=[];[['You ask','#fff','var(--ink)'],['Claude','#fff','var(--ink)'],['Higgsfield connector','var(--teal)','#fff'],['Video ✓','var(--orange)','#fff']].forEach(([t,bgc,fc],i)=>{

 ad:'<svg width="120" height="120" viewBox="0 0 48 48"><path d="M8 20v8h6l14 8V12L14 20z" fill="#F26B3A"/><path d="M33 17c3 2 3 12 0 14M37 13c6 4 6 18 0 22" stroke="#F26B3A" stroke-width="3" fill="none" stroke-linecap="round"/></svg>',
 cine:'<svg width="120" height="120" viewBox="0 0 48 48"><rect x="6" y="18" width="36" height="22" rx="3" fill="#2A211B"/><path d="M6 12l34-6 2 8-34 6z" fill="#F26B3A"/><path d="M14 10.6l4 7M24 8.8l4 7M34 7l4 7" stroke="#fff" stroke-width="2.5"/></svg>',
 ugc:'<svg width="120" height="120" viewBox="0 0 48 48"><rect x="13" y="4" width="22" height="40" rx="5" fill="#19B39B"/><rect x="16" y="9" width="16" height="27" rx="2" fill="#fff"/><circle cx="24" cy="18" r="4" fill="#F26B3A"/><path d="M18 30c1-4 11-4 12 0" fill="#F26B3A"/><circle cx="24" cy="40" r="1.6" fill="#fff"/></svg>',
 anime:'<svg width="120" height="120" viewBox="0 0 48 48"><path d="M24 4l4.5 13.5L42 22l-13.5 4.5L24 40l-4.5-13.5L6 22l13.5-4.5z" fill="#F26B3A"/><path d="M38 34l1.6 4.4L44 40l-4.4 1.6L38 46l-1.6-4.4L32 40l4.4-1.6z" fill="#19B39B"/></svg>',
 mg:'<svg width="120" height="120" viewBox="0 0 48 48"><rect x="6" y="6" width="22" height="22" rx="5" fill="#19B39B"/><rect x="20" y="20" width="22" height="22" rx="5" fill="#F26B3A" opacity=".9"/><path d="M10 40h6M10 34h3" stroke="#2A211B" stroke-width="3" stroke-linecap="round"/></svg>'};

  const page=el('div','abs',body,null,px({left:0,top:0,right:0,bottom:0}));

/* ---------- build ---------- */
const stage=document.getElementById('stage');
const scenes=TL.scenes.map((tl,i)=>{const sc=SC[i];const S=el('div','scene',stage);
  const c=(li,f=0)=>{const L=tl.lines[Math.min(li,tl.lines.length-1)];return (L.start+(L.end-L.start)*f)-tl.start};
  const upd=B[sc.kind](S,c,sc,tl.end-tl.start);return {tl,sc,S,upd}});
/* caption chunks */
const chunks=[];TL.scenes.forEach(s=>s.lines.forEach(L=>{let cur=[],len=0;const push=()=>{if(cur.length)chunks.push({words:cur,start:cur[0].t0,lineEnd:L.end});cur=[];len=0};
  L.words.forEach((w,i)=>{if(len+w.w.length>40&&cur.length)push();cur.push(w);len+=w.w.length+1;if(/[,.?]$/.test(w.w)&&len>22&&i<L.words.length-2)push()});push()}));
chunks.forEach((k,i)=>{const nx=chunks[i+1];k.end=Math.min(k.words[k.words.length-1].t1+.35,nx?nx.start:1e9);if(nx&&nx.start-k.words[k.words.length-1].t1<.7)k.end=nx.start});
const cap=document.getElementById('cap'),hdrt=document.getElementById('hdrt'),hdr=document.getElementById('hdr'),prog=document.getElementById('prog');
let lastChunk=-1;
window.render=function(t){
  bgUpdate(t);prog.style.width=(t/TL.total*1920)+'px';
  let cur=null;scenes.forEach(s=>{const lt=t-s.tl.start,dur=s.tl.end-s.tl.start;const vis=lt>=-0.001&&lt<dur;s.S.style.display=vis?'block':'none';
    if(vis){cur=s;s.S.style.opacity=Math.min(clamp(lt/.35),clamp((dur-lt)/.3));s.upd(lt)}});
  if(cur){hdrt.textContent=cur.sc.label;hdr.style.opacity=1}
  const ci=chunks.findIndex(k=>t>=k.start-.05&&t<k.end);
  if(ci<0){cap.style.opacity=0}else{const k=chunks[ci];cap.style.opacity=1;
    let on=-1;k.words.forEach((w,j)=>{if(t>=w.t0-.02)on=j});if(on>=0&&t>k.words[on].t1+.25)on=-1;cap.innerHTML=k.words.map((w,j)=>`<span class="w ${j===on?'on':(t>=w.t0?'past':'fut')}">${w.w}</span>`).join(' ')}
};
window.READY=document.fonts.ready.then(()=>true);
